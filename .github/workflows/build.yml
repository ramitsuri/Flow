name: Android CI/CD

on:
  push:
    branches:
      - main

# Collapse superseded runs on branches and PRs. Tag runs publish the release
# artifacts and must never be cancelled by a subsequent push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Kotlin formatting
        run: >
          ./gradlew spotlessCheck
          --build-cache --stacktrace

      - name: Generate Version
        id: version
        run: |
          # Calculate minutes since 2026-01-01 00:00:00 UTC
          # 1767243600 is the Unix timestamp for 1767243600000L
          NOW=$(date +%s)
          BASE=1767243600
          VERSION_CODE=$(( (NOW - BASE) / 60 ))
          VERSION_NAME="1.0.$VERSION_CODE"
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Run unit tests
        run: >
          ./gradlew :app:testGithubDebugUnitTest :app:testFossDebugUnitTest
          --max-workers=1 --build-cache --stacktrace

      # Instrumentation tests are not executed in CI, but they must still
      # compile: breakage here otherwise lands on main unnoticed.
      - name: Compile instrumentation tests
        run: >
          ./gradlew :app:compileGithubDebugAndroidTestKotlin
          --build-cache --stacktrace

      - name: Build release APKs
        run: |
          ./gradlew :app:assembleFossRelease -PVERSION_CODE=${{ steps.version.outputs.VERSION_CODE }} -PVERSION_NAME=${{ steps.version.outputs.VERSION_NAME }}

      - name: Sign Apk
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: app/build/outputs/apk/foss/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION_NAME }}
          name: Release ${{ steps.version.outputs.VERSION_NAME }}
          files: ${{ steps.sign_apk.outputs.signedReleaseFile }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
